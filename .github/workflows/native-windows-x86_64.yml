name: Native Windows x86_64

on:
  workflow_dispatch:

env:
  WEBRTC_CACHE_BRANCH: 7204
  WEBRTC_CHECKOUT_FOLDER: webrtc
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  build:
    name: Build Windows x86_64 native jar
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare build
        uses: ./.github/actions/prepare-windows

      - name: Set up WebRTC cache
        uses: actions/cache@v4
        with:
          path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
          key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-windows_x86_64-${{ hashFiles('webrtc-jni/pom.xml') }}
          restore-keys: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-windows_x86_64-

      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-windows_x86_64-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-windows_x86_64-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Build native jar
        run: mvn -pl webrtc-jni package -DskipTests
        shell: bash

      - name: Upload native jar
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-java-0.14.0-windows-x86_64
          path: webrtc-jni/target/webrtc-java-0.14.0-windows-x86_64.jar
          if-no-files-found: error
