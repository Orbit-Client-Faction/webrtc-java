name: Native macOS aarch64

on:
  workflow_dispatch:

env:
  WEBRTC_CACHE_BRANCH: 7204
  WEBRTC_CHECKOUT_FOLDER: webrtc
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  build:
    name: Build macOS aarch64 native jar
    # macos-14 runners are Apple silicon: the macos-aarch64 profile activates by itself.
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare build
        uses: ./.github/actions/prepare-macos

      - name: Set up WebRTC cache
        uses: actions/cache@v4
        with:
          path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
          key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-macos_arm64-${{ hashFiles('webrtc-jni/pom.xml') }}
          restore-keys: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-macos_arm64-

      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-macos_arm64-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-macos_arm64-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          architecture: aarch64
          java-version: 17
          distribution: temurin

      - name: Build native jar
        run: mvn -pl webrtc-jni package -DskipTests

      # The CDN serves the bare dylib (natives/webrtc/) next to a .sha256 companion.
      - name: Extract and check the dylib
        run: |
          set -euo pipefail
          lib=libwebrtc-java-macos-aarch64.dylib
          mkdir -p cdn
          unzip -j webrtc-jni/target/webrtc-java-0.14.0-macos-aarch64.jar "$lib" -d cdn
          archs="$(lipo -archs "cdn/$lib")"
          if [ "$archs" != "arm64" ]; then
            echo "::error::$lib is built for '$archs' instead of arm64 alone"
            exit 1
          fi
          # arm64 macOS refuses to load unsigned code; the linker ad-hoc signs arm64 output.
          codesign --verify --strict "cdn/$lib"
          otool -l "cdn/$lib" | grep -A4 LC_BUILD_VERSION
          (cd cdn && shasum -a 256 "$lib" > "$lib.sha256" && cat "$lib.sha256")

      - name: Upload native jar
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-java-0.14.0-macos-aarch64
          path: webrtc-jni/target/webrtc-java-0.14.0-macos-aarch64.jar
          if-no-files-found: error

      - name: Upload CDN files
        uses: actions/upload-artifact@v4
        with:
          name: libwebrtc-java-macos-aarch64
          path: cdn/
          if-no-files-found: error
