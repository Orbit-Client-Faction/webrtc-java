name: Native macOS x86_64

on:
  workflow_dispatch:

env:
  WEBRTC_CACHE_BRANCH: 7204
  WEBRTC_CHECKOUT_FOLDER: webrtc
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  build:
    name: Build macOS x86_64 native jar
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare build
        uses: ./.github/actions/prepare-macos

      - name: Set up WebRTC cache
        uses: actions/cache@v4
        with:
          path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
          key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-macos_x86-64-${{ hashFiles('webrtc-jni/pom.xml') }}
          restore-keys: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-macos_x86-64-

      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-macos_x86-64-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-macos_x86-64-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          architecture: x64
          java-version: 17
          distribution: temurin

      - name: Build native jar
        run: arch -x86_64 mvn -pl webrtc-jni package -DskipTests -Pmacos-cross-x86_64

      - name: Upload native jar
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-java-0.14.0-macos-x86_64
          path: webrtc-jni/target/webrtc-java-0.14.0-macos-x86_64.jar
          if-no-files-found: error
