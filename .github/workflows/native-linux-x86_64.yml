name: Native Linux x86_64

on:
  workflow_dispatch:

env:
  WEBRTC_CACHE_BRANCH: 7204
  WEBRTC_CHECKOUT_FOLDER: webrtc
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  build:
    name: Build Linux x86_64 native jar
    # Single-entry matrix on purpose: the prepare-linux composite action gates its
    # sysroot installation on matrix.platform.name, mirroring upstream's build.yml.
    strategy:
      matrix:
        platform:
          - name: linux_x86-64
            runs-on: ubuntu-22.04

    runs-on: ${{ matrix.platform.runs-on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare build
        uses: ./.github/actions/prepare-linux

      - name: Set up WebRTC cache
        uses: actions/cache@v4
        with:
          path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
          key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-linux_x86-64-${{ hashFiles('webrtc-jni/pom.xml') }}
          restore-keys: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-linux_x86-64-

      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-linux_x86-64-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-linux_x86-64-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Build native jar
        run: mvn -pl webrtc-jni package -DskipTests

      - name: Upload native jar
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-java-0.14.0-linux-x86_64
          path: webrtc-jni/target/webrtc-java-0.14.0-linux-x86_64.jar
          if-no-files-found: error
